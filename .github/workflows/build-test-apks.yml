name: Build ZAVI ONE and ADMIN test APKs

on:
  push:
    branches: [main, 'fix/unified-clean-ui-20261105']
    paths:
      - '.github/workflows/build-test-apks.yml'
      - 'android-build/**'
      - 'packages/shared/**'
      - 'apps/one/**'
      - 'apps/admin/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-apks:
    name: Build and publish both debug test APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          chmod +x ./gradlew
      - name: Check source asset integrity before packaging
        run: python3 scripts/check-web-assets.py
      - name: Compile both apps as debug APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-test-apks
          for app in one admin; do
            mkdir -p android-build/app/src/main/assets
            find android-build/app/src/main/assets -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a "apps/$app/." android-build/app/src/main/assets/
            # Embed the exact source identity in each APK, not a renamed old binary.
            printf '{"version":"%s","commit":"%s","app":"%s","workflow_run":"%s"}\\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$app" "$GITHUB_RUN_NUMBER" > android-build/app/src/main/assets/zavi-build-info.json
            test -s android-build/app/src/main/assets/zavi-build-info.json
            mkdir -p android-build/app/src/main/assets/packages/shared
            cp -a packages/shared/. android-build/app/src/main/assets/packages/shared/
            mkdir -p android-build/app/src/main/res/drawable-nodpi android-build/app/src/main/res/values android-build/app/src/main/res/xml
            cp "apps/$app/icon-192.png" android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.png
            printf '%s\n' '<resources><style name="ZaviTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:windowLightStatusBar">false</item></style></resources>' > android-build/app/src/main/res/values/styles.xml
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="camera" path="."/></paths>' > android-build/app/src/main/res/xml/zavi_camera_paths.xml
            ./gradlew :app:clean :app:assembleDebug -PzaviApp="$app" --stacktrace
            apk=$(find android-build/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
            test -n "$apk"
            if [[ "$app" == "one" ]]; then name="ZAVI-ONE-TEST.apk"; else name="ZAVI-ONE-ADMIN-TEST.apk"; fi
            unzip -l "$apk" | grep -F "assets/index.html" >/dev/null || { echo "::error::Missing app HTML in APK"; exit 1; }
            unzip -p "$apk" assets/index.html | grep -F "zavi-unified-compact-v1.css" >/dev/null || { echo "::error::UI entrypoint not packaged"; exit 1; }
            unzip -l "$apk" | grep -F "assets/zavi-unified-compact-v1.css" >/dev/null || { echo "::error::UI stylesheet missing in APK"; exit 1; }
            cp "$apk" "final-test-apks/$name"
            "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose "final-test-apks/$name"
          done
          ls -lh final-test-apks/*.apk
          (cd final-test-apks && sha256sum *.apk > SHA256SUMS.txt)
          cat final-test-apks/SHA256SUMS.txt
      - name: Upload test APK artifacts (best effort; quota may be exhausted)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZAVI-TEST-APKS-${{ github.run_number }}
          path: |
            final-test-apks/*.apk
            final-test-apks/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish test APKs to GitHub Releases with retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="zavi-test-${GITHUB_RUN_NUMBER}"
          notes="DEBUG TEST BUILDS ONLY. Android debug signing; not a production release."
          for attempt in 1 2 3 4; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" final-test-apks/*.apk final-test-apks/SHA256SUMS.txt --clobber && exit 0
            else
              gh release create "$tag" final-test-apks/*.apk final-test-apks/SHA256SUMS.txt --title "ZAVI test APKs (${GITHUB_RUN_NUMBER})" --notes "$notes" --prerelease && exit 0
            fi
            echo "Release upload failed (attempt $attempt); APKs remain in workflow artifacts."
            sleep $((attempt * 15))
          done
          echo "::warning::GitHub Releases unavailable; download APKs from workflow Artifacts."
