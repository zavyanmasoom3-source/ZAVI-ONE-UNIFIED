name: Build ZAVI Android APKs
# Release rebuild after successful signing initialization; preserve all application assets.
on:
  push:
    branches: [main, dev]
    paths:
      - 'android-build/**'
      - 'apps/**'
      - 'packages/shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [one, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Android SDK from runner installation
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK directory missing: $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found in runner SDK"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Bootstrap missing wrapper JAR from trusted Gradle distribution
        run: |
          # The repository contains the official Gradle 8.13 launch scripts.
          # Generate the wrapper JAR from the Gradle distribution, not from an untrusted binary.
          for attempt in 1 2 3; do
            if gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Gradle wrapper generation failed after three attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          test -s gradle/wrapper/gradle-wrapper.jar || { echo "::error::Missing generated gradle-wrapper.jar"; exit 1; }
          chmod +x ./gradlew
          ./gradlew --version
      - name: Stage Android WebView assets and resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-build/app/src/main/assets
          cp -a "apps/${{ matrix.app }}/." android-build/app/src/main/assets/
          mkdir -p android-build/app/src/main/assets/packages/shared
          cp -a packages/shared/. android-build/app/src/main/assets/packages/shared/
          mkdir -p android-build/app/src/main/res/drawable-nodpi android-build/app/src/main/res/values android-build/app/src/main/res/xml
          cp "apps/${{ matrix.app }}/icon-192.png" android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.png
          printf '%s\n' '<resources><style name="ZaviTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:windowLightStatusBar">false</item></style></resources>' > android-build/app/src/main/res/values/styles.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="camera" path="."/></paths>' > android-build/app/src/main/res/xml/zavi_camera_paths.xml
      - name: Fix inline WebView receipt script parsing
        run: python3 scripts/fix-webview-receipt.py
      - name: Validate embedded HTML is not exposing source code
        run: python3 scripts/validate-webview-html.py
      - name: Assemble debug APK (compilation smoke test)
        run: ./gradlew :app:assembleDebug -PzaviApp=${{ matrix.app }} --stacktrace
      - name: Verify debug APK locally without consuming artifact quota
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android-build/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk" || { echo "::error::Debug APK not found"; exit 1; }
          echo "Debug compilation succeeded: $(basename "$apk")"
      - name: Compile optimized release with R8 independently of signing
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -PzaviApp=${{ matrix.app }} -PzaviUnsignedReleaseQa=true --stacktrace
          apk=$(find android-build/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk" || { echo "::error::R8 release compilation produced no APK"; exit 1; }
          echo "R8/resource shrinking compilation succeeded. Unsigned QA output will not be published."
          rm -f "$apk"
      - name: Check release signing secrets availability
        id: signing
        env:
          STORE_B64: ${{ secrets.ZAVI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZAVI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAVI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAVI_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Release signing secrets unavailable; refusing to publish incomplete release."
            exit 1
          fi
      - name: Validate and decode release keystore securely
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          STORE_B64: ${{ secrets.ZAVI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZAVI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAVI_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          # Do not log the keystore, its base64, or any password.
          if ! printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/zavi-release.jks" 2>/dev/null; then
            rm -f "$RUNNER_TEMP/zavi-release.jks"
            echo "::error::ZAVI_RELEASE_KEYSTORE_BASE64 is not valid Base64. Run 'Initialize ZAVI Android release signing (one time)' successfully to replace the placeholder secret."
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/zavi-release.jks" ]]; then
            echo "::error::Decoded keystore is empty. Initialize release signing first."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/zavi-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore/password/alias mismatch. Verify release signing secrets and initialize signing if needed."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/zavi-release.jks"
      - name: Assemble signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ZAVI_RELEASE_STORE_FILE: ${{ runner.temp }}/zavi-release.jks
          ZAVI_RELEASE_STORE_PASSWORD: ${{ secrets.ZAVI_RELEASE_STORE_PASSWORD }}
          ZAVI_RELEASE_KEY_ALIAS: ${{ secrets.ZAVI_RELEASE_KEY_ALIAS }}
          ZAVI_RELEASE_KEY_PASSWORD: ${{ secrets.ZAVI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PzaviApp=${{ matrix.app }} --stacktrace
      - name: Verify and name signed release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android-build/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p final-apks
          if [[ "${{ matrix.app }}" == "one" ]]; then
            name="ZAVI-ONE.apk"
          else
            name="ZAVI-ONE-ADMIN.apk"
          fi
          cp "$apk" "final-apks/$name"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER" || { echo "::error::Android SDK apksigner missing at $APKSIGNER"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "final-apks/$name"
      - name: Publish signed APK directly to GitHub Releases
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-build-${GITHUB_RUN_NUMBER}"
          asset=$(find final-apks -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$asset"
          # Matrix jobs may reach this point simultaneously. Only one creates
          # the release; the other waits for it instead of failing on a race.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "ZAVI ONE Android build ${GITHUB_RUN_NUMBER}" --notes "Signed Android builds from commit ${GITHUB_SHA}. Automated build only; device and functional QA are still required." --prerelease || true
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$tag" >/dev/null || { echo "::error::GitHub Release creation failed"; exit 1; }
          for attempt in 1 2 3; do
            if gh release upload "$tag" "$asset" --clobber; then
              echo "Published $asset to release $tag"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Unable to publish $asset after retries"
          exit 1
