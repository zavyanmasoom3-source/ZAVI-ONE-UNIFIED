name: Build ZAVI Android APKs
on:
  push:
    branches: [main]
    paths:
      - 'android-build/**'
      - 'apps/**'
      - 'packages/shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [one, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Android SDK from runner installation
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK directory missing: $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found in runner SDK"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Bootstrap missing wrapper JAR from trusted Gradle distribution
        run: |
          # The repository contains the official Gradle 8.13 launch scripts.
          # Generate the wrapper JAR from the Gradle distribution, not from an untrusted binary.
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew --version
      - name: Stage Android WebView assets and resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-build/app/src/main/assets
          cp -a "apps/${{ matrix.app }}/." android-build/app/src/main/assets/
          mkdir -p android-build/app/src/main/assets/packages/shared
          cp -a packages/shared/. android-build/app/src/main/assets/packages/shared/
          mkdir -p android-build/app/src/main/res/drawable-nodpi android-build/app/src/main/res/values android-build/app/src/main/res/xml
          cp "apps/${{ matrix.app }}/icon-192.png" android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.png
          printf '%s\n' '<resources><style name="ZaviTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:windowLightStatusBar">false</item></style></resources>' > android-build/app/src/main/res/values/styles.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="camera" path="."/></paths>' > android-build/app/src/main/res/xml/zavi_camera_paths.xml
      - name: Assemble debug APK (compilation smoke test)
        run: ./gradlew :app:assembleDebug -PzaviApp=${{ matrix.app }} --stacktrace
      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAVI-${{ matrix.app }}-debug-test
          path: android-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Check release signing secrets availability
        id: signing
        env:
          STORE_B64: ${{ secrets.ZAVI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZAVI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAVI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAVI_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets unavailable; debug smoke APK only."
          fi
      - name: Decode release keystore securely
        if: steps.signing.outputs.available == 'true'
        env:
          STORE_B64: ${{ secrets.ZAVI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/zavi-release.jks"
          chmod 600 "$RUNNER_TEMP/zavi-release.jks"
      - name: Assemble signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ZAVI_RELEASE_STORE_FILE: ${{ runner.temp }}/zavi-release.jks
          ZAVI_RELEASE_STORE_PASSWORD: ${{ secrets.ZAVI_RELEASE_STORE_PASSWORD }}
          ZAVI_RELEASE_KEY_ALIAS: ${{ secrets.ZAVI_RELEASE_KEY_ALIAS }}
          ZAVI_RELEASE_KEY_PASSWORD: ${{ secrets.ZAVI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PzaviApp=${{ matrix.app }} --stacktrace
      - name: Verify and name signed release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android-build/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p final-apks
          if [[ "${{ matrix.app }}" == "one" ]]; then
            name="ZAVI-ONE.apk"
          else
            name="ZAVI-ONE-ADMIN.apk"
          fi
          cp "$apk" "final-apks/$name"
          apksigner verify --verbose "final-apks/$name"
      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZAVI-${{ matrix.app }}-release-signed
          path: final-apks/*.apk
          if-no-files-found: error
